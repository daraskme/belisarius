name: 旧Pagesを新サイトへ転送

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: belisarius-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages-production
      url: https://belisarius-git.pages.dev/
    steps:
      - name: ソースを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Node.jsを準備
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: 旧URLからの転送を準備
        run: node scripts/build-legacy-redirect.mjs
      - name: 旧Pagesへ転送設定を公開
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.151.2'
          command: pages deploy legacy-redirect --project-name=belisarius --branch=main
